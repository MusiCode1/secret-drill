<!doctype html>
<html lang="%lang%" dir="%dir%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- CSP enforced via HTTP headers (static/_headers for Cloudflare Pages).
		     Meta tag removed because: 1) frame-ancestors is ignored in meta, 
		     2) SvelteKit uses inline scripts that require nonce/hash support. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
